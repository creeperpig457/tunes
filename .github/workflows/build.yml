name: Build IPA



on:

  workflow_dispatch:

  push:

    branches: [main]



jobs:

  build:

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4

      - run: brew install xcodegen

      - run: xcodegen generate

      - name: Build unsigned IPA

        run: |

          xcodebuild -project Tunes.xcodeproj -scheme Tunes -configuration Release \

            -sdk iphoneos -derivedDataPath build \

            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

          mkdir Payload

          cp -R build/Build/Products/Release-iphoneos/Tunes.app Payload/

          zip -r Tunes.ipa Payload

      - uses: actions/upload-artifact@v4

        with:

          name: Tunes-ipa

          path: Tunes.ipa
